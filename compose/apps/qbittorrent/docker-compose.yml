services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: ${VPN_TYPE}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESS}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES}
      VPN_PORT_FORWARDING: "on"
      VPN_PORT_FORWARDING_PROVIDER: protonvpn
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -q -O /dev/null
        --post-data="json={\"listen_port\":{{PORTS}}}"
        http://localhost:8080/api/v2/app/setPreferences'
    volumes:
      - type: volume
        source: qbittorrent_data
        target: /gluetun
        volume:
          subpath: gluetun
    networks:
      - traefik_public
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      traefik.enable: "true"
      traefik.http.routers.qbittorrent.rule: "Host(`qbit.${DOMAIN}`)"
      traefik.http.routers.qbittorrent.entrypoints: websecure
      traefik.http.services.qbittorrent.loadbalancer.server.port: "8080"
      traefik.http.services.qbittorrent.loadbalancer.server.scheme: "http"
      traefik.http.services.qbittorrent.loadbalancer.healthcheck.path: "/"
      traefik.http.services.qbittorrent.loadbalancer.healthcheck.interval: "15s"
      traefik.http.services.qbittorrent.loadbalancer.healthcheck.timeout: "5s"
      kuma.qbittorrent.http.name: qBittorrent
      kuma.qbittorrent.http.url: https://qbit.${DOMAIN}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9999"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      WEBUI_PORT: "8080"
    volumes:
      - type: volume
        source: qbittorrent_data
        target: /config
        volume:
          subpath: config
      - /srv:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 32M
    restart: unless-stopped

volumes:
  qbittorrent_data:
    external: true

networks:
  traefik_public:
    external: true
